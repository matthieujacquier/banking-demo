<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>NexaBank · Personal Loans 3D</title>

<style>
  :root{ --accent:#2563FF; --accent-soft:#5b8bff; --accent-deep:#1746D1; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    font-family:-apple-system,'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif}
  .scene{
    position:relative;width:100%;height:100%;
    display:grid;place-items:center start;
    padding-left: calc(4% - 80px);
    perspective: 2200px;
    perspective-origin: 30% 35%;
  }
  .stage{
    position:relative;
    width: 900px; height: 560px;
    transform-style:preserve-3d;
    transition: transform .5s cubic-bezier(.2,.7,.2,1);
    transform: scale(0.7) rotateX(22deg) rotateZ(0deg);
  }

  /* ====== ROAD ====== */
  .road{
    position:absolute;left:50%;top:50%;
    width: 800px; height: 80px;
    margin: -40px 0 0 -400px;
    transform-style:preserve-3d;
    transform: translateZ(0);
  }
  .road-base{
    position:absolute;inset:0;
    background:
      linear-gradient(180deg, #1a1a22 0%, #0a0a10 100%);
    border-radius: 4px;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.04),
      inset 0 0 40px rgba(0,0,0,.5),
      0 20px 50px -20px rgba(0,0,0,.7);
  }
  /* Progress fill on the road (paid portion) */
  .road-fill{
    position:absolute;left:0;top:0;bottom:0;
    width: 56%;
    background:
      linear-gradient(180deg, rgba(91,139,255,.4) 0%, rgba(37,99,255,.2) 100%);
    border-radius: 4px 0 0 4px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.25),
      0 0 24px rgba(37,99,255,.4);
  }
  .road-fill::after{
    content:'';position:absolute;right:0;top:0;bottom:0;width:60px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.25));
    filter: blur(2px);
  }
  .road-edge{
    position:absolute;left:0;right:0;height:1.5px;
    background: linear-gradient(90deg, transparent, rgba(37,99,255,.5) 5%, rgba(37,99,255,.5) 95%, transparent);
  }
  .road-edge.top{ top:-1px }
  .road-edge.bot{ bottom:-1px }

  /* Tick marks on the road */
  .road-ticks{
    position:absolute;inset:0;
    background-image: repeating-linear-gradient(90deg, transparent 0px, transparent 79px, rgba(255,255,255,.08) 79px, rgba(255,255,255,.08) 80px);
  }

  /* ====== MILESTONES (3D plinths above the road) ====== */
  .milestones{
    position:absolute;left:50%;top:50%;
    width: 800px; height: 80px;
    margin: -40px 0 0 -400px;
    transform-style:preserve-3d;
  }
  .milestone{
    position:absolute;
    width: 130px;
    transform-style: preserve-3d;
    /* translation set inline */
  }
  .pin{
    /* vertical stem */
    position:absolute;left:50%;
    width: 2px;
    margin-left: -1px;
    background: linear-gradient(180deg, rgba(37,99,255,.8), rgba(37,99,255,.1));
    box-shadow: 0 0 8px rgba(37,99,255,.5);
  }
  .pin.paid{ background: linear-gradient(180deg, rgba(91,139,255,1), rgba(37,99,255,.4)); box-shadow: 0 0 12px rgba(91,139,255,.7); }

  .marker{
    position:absolute;left:50%;
    width: 76px;height:76px;margin-left:-38px;
    border-radius: 16px;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.16), transparent 55%),
      linear-gradient(160deg, #2a2a36 0%, #0e0e16 100%);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.08),
      inset 0 1px 0 rgba(255,255,255,.18),
      0 14px 30px -10px rgba(0,0,0,.7);
    transform: rotateX(-22deg); /* counter the stage tilt so icon faces camera */
    display:grid;place-items:center;
    color:#9ca3b5;
    transition: color .3s ease, box-shadow .3s ease;
  }
  .marker svg{ width:36px;height:36px;display:block;filter: drop-shadow(0 2px 2px rgba(0,0,0,.6)); }
  .milestone.paid .marker{
    color:#fff;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.25), transparent 55%),
      linear-gradient(160deg, #2563FF 0%, #1746D1 100%);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.18),
      inset 0 1px 0 rgba(255,255,255,.35),
      0 14px 30px -8px rgba(37,99,255,.5),
      0 0 30px rgba(37,99,255,.3);
  }
  .milestone .label{
    position:absolute;left:50%;
    transform: translate(-50%, 0) rotateX(-22deg);
    bottom: -28px;
    font-size: 11px; font-weight: 600;
    color: rgba(255,255,255,.6);
    letter-spacing: .3px;
    white-space: nowrap;
  }
  .milestone.paid .label{ color: #fff }

  /* ====== PROGRESS PUCK ====== */
  .puck{
    position:absolute;top:50%;
    width: 28px;height:28px;margin-top:-14px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,.6), transparent 50%),
      radial-gradient(circle at 50% 50%, #5b8bff 0%, #2563FF 70%);
    box-shadow:
      0 0 0 4px rgba(37,99,255,.18),
      0 0 30px rgba(37,99,255,.7),
      inset 0 0 0 1px rgba(255,255,255,.4);
    z-index: 5;
    animation: puckPulse 1.8s ease-in-out infinite;
  }
  @keyframes puckPulse{
    0%,100%{ box-shadow: 0 0 0 4px rgba(37,99,255,.18), 0 0 30px rgba(37,99,255,.7), inset 0 0 0 1px rgba(255,255,255,.4); }
    50%   { box-shadow: 0 0 0 8px rgba(37,99,255,.10), 0 0 44px rgba(37,99,255,.9), inset 0 0 0 1px rgba(255,255,255,.4); }
  }

  /* ====== Floating monthly payment chips ====== */
  .chips{
    position:absolute;left:50%;top:50%;
    width:1px;height:1px;
    transform-style:preserve-3d;
  }
  .chip{
    position:absolute; left:0; top:0;
    padding: 6px 11px;
    border-radius: 99px;
    background: rgba(37,99,255,.16);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border: 1px solid rgba(91,139,255,.4);
    color: #cfdcff;
    font-size: 12px; font-weight: 600;
    letter-spacing: .2px;
    white-space: nowrap;
    transform: rotateX(-22deg);
    box-shadow: 0 8px 24px -8px rgba(37,99,255,.4);
  }

  /* ====== Counter card (top center) ====== */
  .counter{
    position:absolute;left:50%;top:0;
    transform: translate(-50%, -50%) rotateX(-22deg);
    background:
      radial-gradient(circle at 20% 0%, rgba(91,139,255,.18), transparent 60%),
      rgba(16,16,22,.86);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-radius: 18px;
    padding: 14px 22px;
    border: 1px solid rgba(255,255,255,.06);
    box-shadow: 0 24px 50px -16px rgba(0,0,0,.6), 0 0 60px -20px rgba(37,99,255,.3);
    color: #fff;
    white-space: nowrap;
    text-align: left;
  }
  .counter .label{
    font-size:10px;font-weight:700;letter-spacing:3px;
    color: rgba(91,139,255,.95); text-transform:uppercase;
    margin-bottom: 4px;
  }
  .counter .amount{
    font-size: 28px; font-weight: 700; letter-spacing:-.6px;
    line-height: 1;
  }
  .counter .amount .of{
    color: rgba(255,255,255,.4); font-weight:500; font-size: 18px; margin-left: 4px;
  }
  .counter .meta{
    font-size: 11px; color: rgba(255,255,255,.55);
    margin-top: 4px;
  }
  .counter .meta strong{ color: #5b8bff; font-weight: 600; }

  /* ====== Floor glow ====== */
  .floor-glow{
    position:absolute;left:50%;top:50%;
    width: 900px;height:200px;margin:-100px 0 0 -450px;
    background: radial-gradient(ellipse at center, rgba(37,99,255,.18), transparent 70%);
    filter: blur(30px);
    transform: translateZ(-200px);
    pointer-events:none;
  }
</style>
</head>
<body>

<!-- SVG icons defs -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ic-grad" viewBox="0 0 24 24">
      <path d="M2 9l10-4 10 4-10 4-10-4z" fill="currentColor"></path>
      <path d="M6 11v4c0 1 3 2 6 2s6-1 6-2v-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
      <path d="M21 9v6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
    </symbol>
    <symbol id="ic-car" viewBox="0 0 24 24">
      <path d="M5 14l1.5-4.5C6.8 8.6 7.5 8 8.4 8h7.2c.9 0 1.6.6 1.9 1.5L19 14M3 14h18v4a1 1 0 0 1-1 1h-2v-1H6v1H4a1 1 0 0 1-1-1v-4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
      <circle cx="7" cy="17" r="1.2" fill="currentColor"></circle>
      <circle cx="17" cy="17" r="1.2" fill="currentColor"></circle>
    </symbol>
    <symbol id="ic-ring" viewBox="0 0 24 24">
      <!-- diamond ring — clearer at small size: solid diamond + thick band -->
      <path d="M8 7 L12 3 L16 7 L12 12 Z" fill="currentColor" stroke="rgba(0,0,0,.25)" stroke-width=".4"></path>
      <path d="M8 7 L12 12 L16 7" stroke="rgba(255,255,255,.35)" stroke-width=".8" fill="none"></path>
      <circle cx="12" cy="17" r="4" fill="none" stroke="currentColor" stroke-width="2.5"></circle>
    </symbol>
    <symbol id="ic-home" viewBox="0 0 24 24">
      <path d="M3 12l9-8 9 8M5 11v9h5v-5h4v5h5v-9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path>
    </symbol>
    <symbol id="ic-family" viewBox="0 0 24 24">
      <!-- two adults + one child: heads + shoulders side-by-side -->
      <circle cx="7" cy="7" r="2.4" fill="currentColor"></circle>
      <circle cx="17" cy="7" r="2.4" fill="currentColor"></circle>
      <circle cx="12" cy="11.5" r="1.6" fill="currentColor"></circle>
      <path d="M3 21c0-3 1.8-4.7 4-4.7s4 1.7 4 4.7z" fill="currentColor"></path>
      <path d="M13 21c0-3 1.8-4.7 4-4.7s4 1.7 4 4.7z" fill="currentColor"></path>
      <path d="M9.5 21c0-1.6 1.1-2.6 2.5-2.6s2.5 1 2.5 2.6z" fill="currentColor"></path>
    </symbol>
  </defs>
</svg>

<div class="scene">
  <div class="stage" id="stage">

    <div class="floor-glow"></div>

    <div class="road">
      <div class="road-base"></div>
      <div class="road-fill" id="roadFill"></div>
      <div class="road-ticks"></div>
      <div class="road-edge top"></div>
      <div class="road-edge bot"></div>
    </div>

    <div class="milestones" id="milestones"></div>

    <!-- progress puck -->
    <div class="puck" id="puck"></div>

    <!-- counter -->
    <div class="counter">
      <div class="label">Loan progress</div>
      <div class="amount">€<span id="amountPaid">33,600</span><span class="of">/ €60,000</span></div>
      <div class="meta">€450/mo · <strong id="monthsLeft">59 months</strong> remaining</div>
    </div>

    <!-- floating chips removed -->

  </div>
</div>

<script>
(function(){
  const MILESTONES = [
    { x: 0.06, label: 'Studies', icon: 'ic-grad',   paid: true },
    { x: 0.26, label: 'Car',     icon: 'ic-car',    paid: true },
    { x: 0.46, label: 'Wedding', icon: 'ic-ring',   paid: true },
    { x: 0.70, label: 'Home',    icon: 'ic-home',   paid: false },
    { x: 0.92, label: 'Family',  icon: 'ic-family', paid: false },
  ];

  const ROAD_W = 800;
  const PIN_HEIGHTS = [86, 110, 96, 118, 88]; // varied heights so plinths feel less uniform

  const ms = document.getElementById('milestones');
  MILESTONES.forEach((m, i) => {
    const x = m.x * ROAD_W - ROAD_W/2; // centered
    const h = PIN_HEIGHTS[i];
    const el = document.createElement('div');
    el.className = 'milestone' + (m.paid ? ' paid' : '');
    el.style.left = `calc(50% + ${x}px - 65px)`;
    el.style.bottom = `40px`;
    el.style.height = (h + 76) + 'px';
    el.innerHTML = `
      <div class="pin ${m.paid ? 'paid' : ''}" style="bottom:0; height:${h}px"></div>
      <div class="marker" style="bottom:${h - 6}px">
        <svg viewBox="0 0 24 24"><use href="#${m.icon}"/></svg>
      </div>
      <div class="label" style="bottom:${h + 80}px">${m.label}</div>
    `;
    ms.appendChild(el);
  });

  // Puck animation: travels along the paid portion (start to ~58%), bounces back
  const puck = document.getElementById('puck');
  const roadFill = document.getElementById('roadFill');
  const amountEl = document.getElementById('amountPaid');
  const monthsEl = document.getElementById('monthsLeft');
  const TOTAL = 60000;

  let startTime = performance.now();
  const PERIOD = 18000; // ms for full loop

  function animatePuck(t){
    const dt = (t - startTime) / PERIOD;
    // ease in/out, but bias so it sits longer in the "paid" zone
    let progress = Math.min(1, dt % 1);
    // ping-pong: 0 -> 0.58 -> 0 -> ...
    let p;
    const phase = (dt % 1);
    if (phase < .5) p = (phase / .5) * 0.58;
    else            p = (1 - (phase - .5) / .5) * 0.58;

    const xpx = -ROAD_W/2 + p * ROAD_W;
    puck.style.left = `calc(50% + ${xpx}px - 14px)`;
    roadFill.style.width = `${(p * 100).toFixed(1)}%`;

    const paid = Math.round(p * TOTAL);
    amountEl.textContent = paid.toLocaleString('fr-FR');
    const monthsLeft = Math.max(0, Math.round((TOTAL - paid) / 450));
    monthsEl.textContent = monthsLeft + ' months';

    requestAnimationFrame(animatePuck);
  }
  requestAnimationFrame(animatePuck);

  // Floating chips removed per user request — keeping function as no-op for safety
  // (no chips spawned)

  // Mouse parallax
  const stage = document.getElementById('stage');
  let tx=0, ty=0, cx=0, cy=0;
  window.addEventListener('mousemove', e => {
    const rect = document.body.getBoundingClientRect();
    tx = (e.clientX / rect.width  - .5) * 2;
    ty = (e.clientY / rect.height - .5) * 2;
  });
  function loop(){
    cx += (tx - cx) * 0.06;
    cy += (ty - cy) * 0.06;
    stage.style.transform = `scale(0.7) rotateX(${22 - cy * 10}deg) rotateY(${cx * 14}deg)`;
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>


</body></html>
