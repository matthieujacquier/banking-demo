<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>NEXA · Crypto 3D</title>

<style>
  :root{
    --bg:transparent;
    --coin-size: 280px;
    --coin-depth: 32px;
    --edge-segments: 40;
    --accent:#5BB8E5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
  .nexa-scene{
    position:relative;width:100%;height:100%;
    display:grid;place-items:center start;
    padding-left: 4%;
    perspective: 2000px;
    perspective-origin: 30% 45%;
  }
  .nexa-stage{
    position:relative;width:720px;height:520px;
    transform-style:preserve-3d;
    transition: transform .5s cubic-bezier(.2,.7,.2,1);
  }
  /* soft floor reflection */
  .nexa-floor{
    position:absolute;left:50%;bottom:40px;
    width:540px;height:80px;margin-left:-270px;
    background: radial-gradient(ellipse at center, rgba(240,200,120,.16), rgba(0,0,0,0) 70%);
    filter: blur(8px);
    transform: rotateX(78deg) translateZ(-60px);
    pointer-events:none;
  }

  /* === COIN === */
  .coin{
    position:absolute;top:50%;left:50%;
    width:var(--coin-size);height:var(--coin-size);
    margin:calc(var(--coin-size)/-2) 0 0 calc(var(--coin-size)/-2);
    transform-style:preserve-3d;
    will-change: transform;
  }
  .coin .face{
    position:absolute;inset:0;border-radius:50%;
    backface-visibility:hidden;
  }
  .coin .face > *{ border-radius:50%; }
  .coin .front{ transform: translateZ( calc(var(--coin-depth) / 2) ); }
  .coin .back { transform: translateZ( calc(var(--coin-depth) / -2) ) rotateY(180deg); }

  /* layered metal stack for the front — gold */
  .face .base{
    position:absolute;inset:0;border-radius:50%;
    background:
      radial-gradient(circle at 30% 22%, rgba(255,240,200,.45), transparent 45%),
      radial-gradient(circle at 75% 78%, rgba(255,255,255,.12), transparent 55%),
      conic-gradient(from 215deg,
        #5a3a10 0deg,
        #c89548 50deg,
        #8a5e20 110deg,
        #f0d28a 180deg,
        #8a5e20 250deg,
        #c89548 310deg,
        #5a3a10 360deg);
  }
  .face .grain{
    position:absolute;inset:0;border-radius:50%;
    background:
      repeating-conic-gradient(from 0deg, rgba(255,255,255,.045) 0deg, transparent .8deg 1.6deg);
    mix-blend-mode:screen;opacity:.6;
  }
  .face .ring{
    position:absolute;inset:6px;border-radius:50%;
    box-shadow:
      inset 0 0 0 1px rgba(255,230,180,.35),
      inset 0 0 0 3px rgba(70,40,10,.55),
      inset 0 0 0 4px rgba(255,230,180,.15),
      inset 0 0 28px rgba(50,28,8,.55);
  }
  .face .gloss{
    position:absolute;inset:0;border-radius:50%;
    background: linear-gradient(155deg, rgba(255,240,200,.28) 0%, rgba(255,255,255,0) 35%, rgba(255,255,255,0) 65%, rgba(255,220,150,.1) 100%);
    mix-blend-mode:screen;
    pointer-events:none;
  }
  .face .vignette{
    position:absolute;inset:0;border-radius:50%;
    background: radial-gradient(circle at 50% 50%, transparent 55%, rgba(40,22,4,.6) 100%);
    pointer-events:none;
  }
  .face .logo{
    position:absolute;inset:0;display:grid;place-items:center;
    color:transparent;
    font-weight:900;letter-spacing:-2px;
    background: linear-gradient(180deg, #fff4d8, #b07a28 55%, #4a2e08);
    -webkit-background-clip:text;background-clip:text;
    text-shadow: 0 -1px 0 rgba(255,240,200,.2);
    filter: drop-shadow(0 2px 1px rgba(40,22,4,.65));
  }
  .face .logo span{
    font-size: 130px;line-height:1;
    -webkit-text-stroke: .5px rgba(70,40,10,.35);
  }
  .face .tag{
    position:absolute;left:0;right:0;bottom:18%;
    text-align:center;font-size:11px;letter-spacing:6px;color:rgba(70,40,10,.6);
    font-weight:700;
  }
  .face .tick{
    position:absolute;left:0;right:0;top:14%;text-align:center;
    font-family: 'SF Mono', ui-monospace, monospace;font-size:10px;
    letter-spacing:3px;color:rgba(70,40,10,.42);
  }

  /* edge (cylindrical wall) — JS-generated segments ringed around Z axis */
  .edge{ position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none; }
  .edge-seg{
    position:absolute;left:50%;top:50%;
    width: var(--coin-depth);
    height: 24px;
    margin-top: -12px;
    margin-left: calc(var(--coin-depth) / -2);
    /* milled / knurled gold edge — stripes run AXIALLY */
    background:
      repeating-linear-gradient(0deg,
        #4a3210 0px,
        #b58a3a 1.5px,
        #f3d488 3px,
        #b58a3a 4.5px,
        #4a3210 6px),
      linear-gradient(to right, #f3d488, #5a3a10 35%, #d8a850 65%, #5a3a10);
    background-blend-mode: overlay, normal;
    box-shadow: inset 1px 0 0 rgba(255,230,180,.22), inset -1px 0 0 rgba(40,22,4,.5);
  }

  /* coin positions / animations */
  .coin.c1{
    --coin-size: 320px;
    transform: translate3d(-180px,-30px,40px) rotateZ(-8deg);
    animation: bob1 7s ease-in-out infinite, spin 12s linear infinite;
  }
  .coin.c2{
    --coin-size: 260px;
    transform: translate3d(60px,80px,160px) rotateZ(6deg);
    animation: bob2 6s ease-in-out infinite, spinR 18s linear infinite;
    z-index: 3;
  }
  .coin.c3{
    --coin-size: 230px;
    transform: translate3d(220px,-90px,-30px) rotateZ(-2deg);
    animation: bob3 8s ease-in-out infinite, spin 22s linear infinite;
  }
  @keyframes bob1{
    0%,100%{transform:translate3d(-180px,-40px,40px) rotateZ(-8deg) rotateX(8deg)}
    50%{transform:translate3d(-180px,-20px,40px) rotateZ(-8deg) rotateX(8deg)}
  }
  @keyframes bob2{
    0%,100%{transform:translate3d(60px,90px,160px) rotateZ(6deg) rotateX(-4deg)}
    50%{transform:translate3d(60px,70px,160px) rotateZ(6deg) rotateX(-4deg)}
  }
  @keyframes bob3{
    0%,100%{transform:translate3d(220px,-100px,-30px) rotateZ(-2deg) rotateX(12deg)}
    50%{transform:translate3d(220px,-80px,-30px) rotateZ(-2deg) rotateX(12deg)}
  }
  @keyframes spin{
    from{ --r:0deg } to{ --r:360deg }
  }
  /* CSS variables don't animate without @property — fallback: spin on inner */
  .coin .inner{
    position:absolute;inset:0;transform-style:preserve-3d;
    animation: spinY 14s linear infinite;
  }
  .coin.c2 .inner{ animation-duration: 11s; animation-direction:reverse }
  .coin.c3 .inner{ animation-duration: 18s }
  @keyframes spinY{
    from{ transform: rotateY(0deg) }
    to  { transform: rotateY(360deg) }
  }

  /* glow accent behind */
  .glow{
    position:absolute;left:50%;top:50%;
    width:520px;height:520px;margin:-260px 0 0 -260px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(240,200,120,.22), transparent 60%);
    filter: blur(20px);
    transform: translateZ(-200px);
    pointer-events:none;
  }
</style>
</head>
<body>
<div class="nexa-scene">
  <div class="nexa-stage" id="stage">
    <div class="glow"></div>

    <div class="coin c1">
      <div class="inner">
        <div class="edge" data-edge=""></div>
        <div class="face front">
          <div class="base"></div>
          <div class="grain"></div>
          <div class="ring"></div>
          <div class="tick">— BTC —</div>
          <div class="logo"><span>₿</span></div>
          <div class="tag">BITCOIN</div>
          <div class="gloss"></div>
          <div class="vignette"></div>
        </div>
        <div class="face back">
          <div class="base"></div>
          <div class="grain"></div>
          <div class="ring"></div>
          <div class="logo"><span>₿</span></div>
          <div class="gloss"></div>
          <div class="vignette"></div>
        </div>
      </div>
    </div>

    <div class="coin c2">
      <div class="inner">
        <div class="edge" data-edge=""></div>
        <div class="face front">
          <div class="base"></div>
          <div class="grain"></div>
          <div class="ring"></div>
          <div class="tick">— ETH —</div>
          <div class="logo"><span>Ξ</span></div>
          <div class="tag">ETHEREUM</div>
          <div class="gloss"></div>
          <div class="vignette"></div>
        </div>
        <div class="face back">
          <div class="base"></div>
          <div class="grain"></div>
          <div class="ring"></div>
          <div class="logo"><span>Ξ</span></div>
          <div class="gloss"></div>
          <div class="vignette"></div>
        </div>
      </div>
    </div>

    <div class="coin c3">
      <div class="inner">
        <div class="edge" data-edge=""></div>
        <div class="face front">
          <div class="base"></div>
          <div class="grain"></div>
          <div class="ring"></div>
          <div class="tick">— SOL —</div>
          <div class="logo"><span style="font-size:108px">◎</span></div>
          <div class="tag">SOLANA</div>
          <div class="gloss"></div>
          <div class="vignette"></div>
        </div>
        <div class="face back">
          <div class="base"></div>
          <div class="grain"></div>
          <div class="ring"></div>
          <div class="logo"><span style="font-size:108px">◎</span></div>
          <div class="gloss"></div>
          <div class="vignette"></div>
        </div>
      </div>
    </div>

    <div class="nexa-floor"></div>
  </div>
</div>

<script>
(function(){
  // Build cylindrical edges (ring around Z axis = coin's depth axis)
  const SEG = 40;
  document.querySelectorAll('[data-edge]').forEach(edge => {
    const coin = edge.closest('.coin');
    const size = parseFloat(getComputedStyle(coin).getPropertyValue('--coin-size'));
    const r = size / 2;
    // chord length ≈ 2r sin(pi/N), small overlap to hide seams
    const segH = 2 * r * Math.sin(Math.PI / SEG) + 0.8;
    for (let i = 0; i < SEG; i++){
      const seg = document.createElement('div');
      seg.className = 'edge-seg';
      const a = (i / SEG) * 360;
      seg.style.height = segH + 'px';
      seg.style.marginTop = (-segH/2) + 'px';
      seg.style.transform = `rotateZ(${a}deg) translateX(${r}px) rotateY(90deg)`;
      edge.appendChild(seg);
    }
  });

  // Mouse parallax
  const stage = document.getElementById('stage');
  let tx = 0, ty = 0, cx = 0, cy = 0;
  window.addEventListener('mousemove', e => {
    const rect = document.body.getBoundingClientRect();
    tx = (e.clientX / rect.width  - .5) * 2; // -1..1
    ty = (e.clientY / rect.height - .5) * 2;
  });
  function loop(){
    cx += (tx - cx) * 0.06;
    cy += (ty - cy) * 0.06;
    stage.style.transform = `rotateY(${cx * 14}deg) rotateX(${-cy * 10}deg)`;
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>


</body></html>
