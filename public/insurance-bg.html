<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>NexaBank · Shield 3D</title>

<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
  .scene{
    position:relative;width:100%;height:100%;
    display:grid;place-items:center end;
    padding-right: 4%;
    perspective: 2200px;
    perspective-origin: 70% 40%;
  }
  .stage{
    position:relative;
    width: 460px; height: 560px;
    transform-style:preserve-3d;
    animation: bob 6s ease-in-out infinite;
    transition: transform .4s cubic-bezier(.2,.7,.2,1);
  }
  @keyframes bob{
    0%,100%{ transform: translateY(0) rotateZ(-.4deg) }
    50%   { transform: translateY(-14px) rotateZ(.4deg) }
  }
  .tilt{
    position:absolute;inset:0;transform-style:preserve-3d;
    will-change: transform;
  }

  .layer{
    position:absolute; inset:0;
    width:100%; height:100%;
    transform-style: preserve-3d;
  }
  .layer svg{ width:100%; height:100%; display:block; overflow: visible; }

  /* fake thickness: dark side offset (bigger, more visible) */
  .side { transform: translate3d(10px, 14px, -26px); }

  /* main bezel face */
  .face { transform: translateZ(0); }

  /* recessed inner field, slightly behind */
  .field { transform: translateZ(-2px); }

  /* N stacking */
  .n-back  { transform: translate3d(0, 7px, 6px); filter: blur(2.5px); opacity:.65; }
  .n-front { transform: translateZ(10px); }
  .n-bevel { transform: translateZ(11px); pointer-events:none; }

  /* moving specular highlight */
  .spec{
    position:absolute; inset:0;
    transform: translateZ(14px);
    pointer-events:none;
  }
  .spec svg{ width:100%; height:100%; display:block; }

  .ground{
    position:absolute; left:50%; top:100%;
    width: 380px; height: 60px; margin: 8px 0 0 -190px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.6), transparent 70%);
    filter: blur(14px);
    transform: rotateX(82deg) translateZ(-100px);
    pointer-events:none;
  }
</style>
</head>
<body>

<div class="scene">
  <div class="stage" id="stage">
    <div class="tilt" id="tilt">

      <!-- SIDE: dark thickness behind -->
      <div class="layer side">
        <svg viewBox="0 0 240 290">
          <path d="M 30 8 H 210 A 14 14 0 0 1 224 22 V 162 C 224 222 188 256 120 282 C 52 256 16 222 16 162 V 22 A 14 14 0 0 1 30 8 Z" fill="#16161a"></path>
        </svg>
      </div>

      <!-- FACE: outer bezel ring (chrome) -->
      <div class="layer face">
        <svg viewBox="0 0 240 290">
          <defs>
            <linearGradient id="bezelGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff"></stop>
              <stop offset="25%" stop-color="#c4c4cc"></stop>
              <stop offset="50%" stop-color="#76767e"></stop>
              <stop offset="78%" stop-color="#dadae0"></stop>
              <stop offset="100%" stop-color="#a0a0a8"></stop>
            </linearGradient>
          </defs>
          <path d="M 30 8 H 210 A 14 14 0 0 1 224 22 V 162 C 224 222 188 256 120 282 C 52 256 16 222 16 162 V 22 A 14 14 0 0 1 30 8 Z" fill="url(#bezelGrad)" stroke="#1a1a1f" stroke-width="1"></path>
        </svg>
      </div>

      <!-- FIELD: inner inset plate with chrome face -->
      <div class="layer field">
        <svg viewBox="0 0 240 290">
          <defs>
            <linearGradient id="faceGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fbfbfd"></stop>
              <stop offset="25%" stop-color="#e6e6eb"></stop>
              <stop offset="50%" stop-color="#b6b6be"></stop>
              <stop offset="68%" stop-color="#d2d2d8"></stop>
              <stop offset="100%" stop-color="#8a8a92"></stop>
            </linearGradient>
            <radialGradient id="lightGrad" cx="30%" cy="18%" r="78%">
              <stop offset="0%" stop-color="rgba(255,255,255,.55)"></stop>
              <stop offset="55%" stop-color="rgba(255,255,255,0)"></stop>
              <stop offset="100%" stop-color="rgba(0,0,0,.28)"></stop>
            </radialGradient>
          </defs>
          <g transform="translate(120 145) scale(.93) translate(-120 -145)">
            <!-- inner field -->
            <path d="M 30 8 H 210 A 14 14 0 0 1 224 22 V 162 C 224 222 188 256 120 282 C 52 256 16 222 16 162 V 22 A 14 14 0 0 1 30 8 Z" fill="url(#faceGrad)" stroke="#3a3a42" stroke-width=".7" stroke-opacity=".6"></path>
            <!-- soft top-left light wash -->
            <path d="M 30 8 H 210 A 14 14 0 0 1 224 22 V 162 C 224 222 188 256 120 282 C 52 256 16 222 16 162 V 22 A 14 14 0 0 1 30 8 Z" fill="url(#lightGrad)" style="mix-blend-mode:screen"></path>
          </g>
          <!-- beaded edge (dashed stroke, just inside the bezel) -->
          <g transform="translate(120 145) scale(.905) translate(-120 -145)">
            <path d="M 30 8 H 210 A 14 14 0 0 1 224 22 V 162 C 224 222 188 256 120 282 C 52 256 16 222 16 162 V 22 A 14 14 0 0 1 30 8 Z" fill="none" stroke="#3a3a42" stroke-width="1.1" stroke-dasharray="1.2 2.6" stroke-linecap="round" opacity=".78"></path>
          </g>
        </svg>
      </div>

      <!-- N-BACK: dark blurred shadow under letter (stronger lift effect) -->
      <div class="layer n-back" style="transform: translate3d(2px, 9px, 6px); filter: blur(3px); opacity:.7;">
        <svg viewBox="0 0 240 290">
          <path fill-rule="evenodd" d="M 72 80 H 168 V 210 H 72 Z
                   M 100 80 H 142 V 210 Z
                   M 78 80 V 210 H 124 Z" fill="rgba(0,0,0,.85)"></path>
        </svg>
      </div>

      <!-- N-FRONT: carbon fiber fill -->
      <div class="layer n-front">
        <svg viewBox="0 0 240 290">
          <defs>
            <pattern id="carbon" patternUnits="userSpaceOnUse" width="3.2" height="3.2">
              <rect width="3.2" height="3.2" fill="#15151a"></rect>
              <ellipse cx=".8" cy=".8" rx=".75" ry=".55" fill="#262630"></ellipse>
              <ellipse cx="2.4" cy="2.4" rx=".75" ry=".55" fill="#262630"></ellipse>
              <ellipse cx=".8" cy=".8" rx=".28" ry=".18" fill="#3a3a44"></ellipse>
              <ellipse cx="2.4" cy="2.4" rx=".28" ry=".18" fill="#3a3a44"></ellipse>
            </pattern>
            <linearGradient id="nDepth" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="rgba(255,255,255,.22)"></stop>
              <stop offset="35%" stop-color="rgba(255,255,255,0)"></stop>
              <stop offset="65%" stop-color="rgba(0,0,0,0)"></stop>
              <stop offset="100%" stop-color="rgba(0,0,0,.65)"></stop>
            </linearGradient>
          </defs>
          <!-- carbon fill -->
          <path fill-rule="evenodd" d="M 72 80 H 168 V 210 H 72 Z
                   M 100 80 H 142 V 210 Z
                   M 78 80 V 210 H 124 Z" fill="url(#carbon)"></path>
          <!-- top-to-bottom emboss gradient over carbon -->
          <path fill-rule="evenodd" d="M 72 80 H 168 V 210 H 72 Z
                   M 100 80 H 142 V 210 Z
                   M 78 80 V 210 H 124 Z" fill="url(#nDepth)" style="mix-blend-mode:overlay"></path>
        </svg>
      </div>

      <!-- N-BEVEL: chrome rim outline on letter -->
      <div class="layer n-bevel">
        <svg viewBox="0 0 240 290">
          <defs>
            <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="rgba(255,255,255,.95)"></stop>
              <stop offset="35%" stop-color="rgba(220,220,228,.5)"></stop>
              <stop offset="100%" stop-color="rgba(40,40,46,.7)"></stop>
            </linearGradient>
          </defs>
          <!-- bright top-edge highlight rim -->
          <path fill-rule="evenodd" d="M 72 80 H 168 V 210 H 72 Z
                   M 100 80 H 142 V 210 Z
                   M 78 80 V 210 H 124 Z" fill="none" stroke="url(#rimGrad)" stroke-width="3" stroke-linejoin="round" opacity="1"></path>
          <!-- inner dark line -->
          <path fill-rule="evenodd" d="M 72 80 H 168 V 210 H 72 Z
                   M 100 80 H 142 V 210 Z
                   M 78 80 V 210 H 124 Z" fill="none" stroke="rgba(0,0,0,.9)" stroke-width=".9" stroke-linejoin="round"></path>
        </svg>
      </div>

      <!-- SPECULAR HIGHLIGHT: bright spot, masked to shield -->
      <div class="spec">
        <svg viewBox="0 0 240 290">
          <defs>
            <clipPath id="shieldClip">
              <path d="M 30 8 H 210 A 14 14 0 0 1 224 22 V 162 C 224 222 188 256 120 282 C 52 256 16 222 16 162 V 22 A 14 14 0 0 1 30 8 Z"></path>
            </clipPath>
            <radialGradient id="specGrad" cx="0" cy="0" r="80" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="rgba(255,255,255,.55)"></stop>
              <stop offset="50%" stop-color="rgba(255,255,255,.1)"></stop>
              <stop offset="100%" stop-color="rgba(255,255,255,0)"></stop>
            </radialGradient>
          </defs>
          <g clip-path="url(#shieldClip)" style="mix-blend-mode:screen">
            <circle id="specDot" cx="80" cy="60" r="80" fill="url(#specGrad)"></circle>
          </g>
        </svg>
      </div>

    </div>
    <div class="ground"></div>
  </div>
</div>

<script>
(function(){
  const tilt = document.getElementById('tilt');
  const specDot = document.getElementById('specDot');

  let tx=0, ty=0, cx=0, cy=0;
  let smx=80, smy=60, csmx=80, csmy=60;

  window.addEventListener('mousemove', e => {
    const rect = document.body.getBoundingClientRect();
    const nx = e.clientX / rect.width;
    const ny = e.clientY / rect.height;
    tx = (nx - .5) * 2;
    ty = (ny - .5) * 2;
    // specular dot moves with mouse across the shield (240x290 viewbox)
    smx = 40 + nx * 160;
    smy = 20 + ny * 200;
  });

  function loop(){
    cx += (tx - cx) * 0.07;
    cy += (ty - cy) * 0.07;
    csmx += (smx - csmx) * 0.12;
    csmy += (smy - csmy) * 0.12;
    tilt.style.transform = `rotateX(${-cy * 12}deg) rotateY(${cx * 16}deg)`;
    if (specDot){
      specDot.setAttribute('cx', csmx.toFixed(1));
      specDot.setAttribute('cy', csmy.toFixed(1));
    }
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>


</body></html>
